[databases]
* = host=${POSTGRES_DIRECT_HOST:-postgis} port=${POSTGRES_DIRECT_PORT:-5432} dbname=${POSTGRES_DB:-gis}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

; Connection limits
max_client_conn = 400
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Connection lifecycle
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 300
query_wait_timeout = 120
client_idle_timeout = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin access for SHOW commands (swh doctor uses this)
admin_users = ${POSTGRES_USER:-socialwarehouse}
stats_users = ${POSTGRES_USER:-socialwarehouse}
